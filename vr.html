<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>360° 導覽</title>
<style>
:root{--bg:#121614;--panel:rgba(18,22,20,.86);--fg:#e8ece9;--muted:#a5aea9;--accent:#86bba7;--line:#2f3833;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#vr-stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#vr-stage:active{cursor:grabbing}
#vr-stage canvas{display:block}
.bar{position:fixed;left:0;right:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;justify-content:space-between}
.bottom{bottom:0;padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.top h1{font-size:15px;margin:0;font-weight:700}.top h1 #vr-scene{color:var(--muted);font-weight:400;margin-left:10px}
a{color:var(--accent);text-decoration:none;font-size:14px}
button{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid var(--line);padding:6px 12px;border-radius:3px;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#102019;border-color:var(--accent);font-weight:700}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#vr-list{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto}
.tools{display:flex;gap:6px;flex-wrap:wrap}
#vr-loading,#vr-msg,#vr-angle{position:fixed;z-index:3;left:50%;transform:translateX(-50%);background:var(--panel);padding:6px 14px;border-radius:3px;font-size:14px}
#vr-loading{top:45%}#vr-msg{top:30%}#vr-angle{top:calc(env(safe-area-inset-top,0px) + 60px);font-family:ui-monospace,Menlo,monospace}
#vr-angle::after{content:"";position:fixed;left:50%;top:calc(50vh - 60px);width:10px;height:10px;margin-left:-5px;border:2px solid #fff;border-radius:50%}
#vr-exit{position:fixed;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);background:var(--panel)}
body:not(.cardboard) #vr-exit{display:none}
body.cardboard .bar,body.cardboard #vr-angle{display:none}
body.cardboard #vr-stage::after{content:"";position:fixed;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#000}
</style>
</head>
<body>
<div id="vr-stage" aria-label="360 度全景，拖曳可以轉動視角"></div>
<div class="bar top"><h1><span id="vr-title">360° 導覽</span><span id="vr-scene"></span></h1><a id="vr-back" href="index.html#vr">← 回到作品頁</a></div>
<div class="bar bottom">
  <div id="vr-list" aria-label="房間"></div>
  <div class="tools">
    <button id="btn-gyro" type="button">手機陀螺儀</button>
    <button id="btn-cardboard" type="button">Cardboard</button>
    <button id="btn-xr" class="primary" type="button" hidden>進入 VR（Quest）</button>
    <button id="btn-angle" type="button">顯示角度</button>
  </div>
</div>
<div id="vr-loading">載入中…</div>
<div id="vr-msg" hidden></div>
<div id="vr-angle" hidden></div>
<button id="vr-exit" type="button">離開 Cardboard</button>
<script src="vendor/three.min.js"></script>
<script src="tours.js"></script>
<script src="vr.js"></script>
</body>
</html>
