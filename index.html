<section class="home-sec" id="how"><h2>怎麼完成這個網站</h2>
<ol class="steps">
<li>在你的 repository 頁面點 <code>my-project.js</code>，按右上角的鉛筆圖示開始編輯。照檔案裡的說明，把每一關的文字填進兩個反引號 <code>` `</code> 中間。</li>
<li>圖片：回到 repository 首頁，點進 <code>img</code> 資料夾，按「Add file」→「Upload files」上傳。再回到 <code>my-project.js</code>，在 <code>file</code> 填入檔名，例如 <code>img/sketch.jpg</code>。</li>
<li>每次改完都按「Commit changes」。等 1～2 分鐘，重新整理網頁就會看到更新。</li>
<li>網頁上標示「待填寫」的地方就是還沒完成的部分。上方的進度條和每一關旁邊的數字，會告訴你還差多少。</li>
<li>如果整頁突然變成錯誤訊息，通常是少了反引號、逗號或大括號。請打開 <code>my-project.js</code>，檢查剛剛改過的那幾行。</li>
<li>規則：手繪草圖要先給老師蓋章才能用 AI；每一關都要寫決策紀錄；不要寫全名、座號或放自己的照片。</li>
</ol></section>
<section class="home-sec" id="make-360"><h2>做出自己的 360° 全景，並用 VR 頭盔觀看</h2>
<p class="fine">不需要付費的 VR 平台。全景圖用 AI 從你自己的圖生成，導覽就放在你自己的 GitHub Pages 網站上，電腦、手機、Google Cardboard 和 Meta Quest 都能看。</p>
<ol class="steps">
<li><b>選房間：</b>依照第 4 關的平面圖，選 2 到 4 個空間（例如客廳、臥室、你最得意的特色空間）。每個空間準備一張你自己的室內渲染圖或草圖當參考。</li>
<li><b>生成全景：</b>到 <a href="https://skybox.blockadelabs.com/" target="_blank" rel="noopener">Skybox AI</a> 註冊免費帳號。用 <b>Remix</b> 上傳你的室內圖（或用 Sketch 模式描出房間輪廓），再寫提示詞，例如「寫實室內，清水混凝土牆，整面落地窗面向松林山谷，木地板，傍晚暖光」。內容要跟你的平面圖一致：窗戶在哪、門通往哪裡、用什麼材料。免費方案的次數和解析度有限制，以網站當下的說明為準。</li>
<li><b>下載與檢查：</b>下載 JPG，寬度必須是高度的 2 倍（例如 4096×2048，越大越清楚）。檢查三件事：左右兩邊接起來是否連續、天花板和地板有沒有嚴重扭曲、跟你的平面圖和外觀圖是否一致。不一致的地方寫進第 5 關的決策紀錄。</li>
<li><b>放上網站：</b>把全景圖上傳到 <code>pano</code> 資料夾，打開 <code>tours.js</code>，每個房間填一行：名稱、圖檔、要連到哪個房間。熱點位置用「yaw（左右角度）」和「pitch（上下角度）」表示：在導覽頁按「顯示角度」，把畫面中心對準門口，讀出來的數字就是要填的值。</li>
<li><b>觀看：</b>
  <ul>
  <li>電腦：用滑鼠拖曳，滾輪縮放，點熱點換房間。</li>
  <li>手機：按「手機陀螺儀」，轉動手機就能看四周（iPhone 會先問你是否允許「動作與方向」，請按允許）。</li>
  <li>Google Cardboard：手機橫放，按「Cardboard」，再把手機放進紙盒。看著熱點 1.5 秒，就會移動到下一個房間。輕點螢幕可以離開。</li>
  <li>Meta Quest：在頭盔裡打開瀏覽器（Meta Quest Browser），輸入你的網址，開啟導覽頁後按「進入 VR（Quest）」，用手把的扳機點熱點。</li>
  </ul></li>
</ol>
<p class="fine">不想自己改 tours.js 的話，也可以把全景圖上傳到 Momento360 或 Kuula 這類免費全景平台，再把連結放進你的網頁。只是這些平台的免費方案限制常常變動，熱點和 VR 模式能不能用，請以平台當下的說明為準。</p>
</section>
